[project]
name = "netsentinel"
version = "0.1.0"
description = "API-driven network threat detection and incident response"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.7",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "httpx>=0.27",
  "claude-agent-sdk>=0.2",
  "jinja2>=3.1",
  "cicflowmeter==0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pip-audit>=2.7"]

[project.scripts]
netsentinel = "netsentinel.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netsentinel*"]

[tool.setuptools.package-data]
netsentinel = ["migrations/*.sql", "api/templates/*.html", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
