# Template: enable-redirect.sh fills in the domain placeholder from config/site.json.
# __DOMAIN__ on plain HTTP: redirect everything to the HTTPS dashboard,
# except Let's Encrypt's renewal challenge, which must stay reachable over HTTP.
<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot /var/www/html/public
    RedirectMatch 301 "^/(?!\.well-known/acme-challenge/)" "https://__DOMAIN__:8443/dashboard"
    ErrorLog ${APACHE_LOG_DIR}/netsentinel-error.log
    CustomLog ${APACHE_LOG_DIR}/netsentinel-access.log combined
</VirtualHost>
